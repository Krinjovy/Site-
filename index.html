<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бонус для подписчиков</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:30px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.emoji{font-size:56px}
h1{font-size:22px;margin:14px 0 8px;color:#111}
p{font-size:15px;color:#555;line-height:1.5;margin-bottom:20px}
.step{background:#f4f6f8;border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px;color:#333;text-align:left}
.btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:14px}
.push{background:linear-gradient(90deg,#11998e,#38ef7d)}
.offer{background:linear-gradient(90deg,#ff512f,#dd2476)}
.note{font-size:12px;color:#999}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🎁</div>
  <h1>Бонус для подписчиков из Казахстана</h1>
  <p>Включи уведомления — и получай эксклюзивные предложения и розыгрыши первым!</p>

  <div class="step">Шаг 1. Включи уведомления</div>
  <button class="btn push" onclick="alert('Нажми РАЗРЕШИТЬ в появившемся окне 🔔')">🔔 Включить уведомления</button>

  <div class="step">Шаг 2. Получи свой бонус</div>
  <button class="btn offer" onclick="window.location.href='https://nord.affpmelody.com/EEKLY7'"> Получить бонус</button>

  <div class="note">18+ · Только для жителей Казахстана</div>
</div>
</body>
</html>
